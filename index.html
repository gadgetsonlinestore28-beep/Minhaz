<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d7a5f">
<meta name="description" content="ডাঃ মিনহাজ প্রজনন ব্যবস্থাপনা অ্যাপ">
<title>ডাঃ মিনহাজ প্রজনন অ্যাপ</title>
<style>
:root{
  --brand:#0d7a5f;
  --brand-dark:#095c47;
  --brand-light:#e6f4ef;
  --bg:#f2f6f5;
  --card:#ffffff;
  --text:#12211d;
  --muted:#6b8079;
  --line:#dde8e4;
  --danger:#d64545;
  --radius:16px;
  --shadow:0 2px 10px rgba(13,122,95,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans Bengali","Hind Siliguri","SolaimanLipi",system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.65;
  padding-bottom:92px; min-height:100vh;
}
h1,h2,h3,p{margin:0}

/* Header */
.app-header{
  position:sticky; top:0; z-index:50;
  background:linear-gradient(135deg,var(--brand),var(--brand-dark));
  color:#fff; padding:14px 16px;
  display:flex; align-items:center; gap:12px;
  box-shadow:0 3px 14px rgba(0,0,0,.12);
}
.logo{
  width:44px;height:44px;border-radius:12px;flex:0 0 44px;
  background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3);
  display:grid;place-items:center;
}
.app-header h1{font-size:16px;font-weight:700;line-height:1.3}
.app-header p{font-size:12px;opacity:.85}
.install-btn{
  margin-left:auto; background:rgba(255,255,255,.2); color:#fff;
  border:1px solid rgba(255,255,255,.5); border-radius:999px;
  padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer;
  font-family:inherit; white-space:nowrap;
}
.install-btn:active{background:rgba(255,255,255,.35)}
[hidden]{display:none !important}

/* Layout */
main{max-width:640px;margin:0 auto;padding:16px}
.tab{display:none}
.tab.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Cards */
.card{
  background:var(--card); border-radius:var(--radius);
  padding:16px; box-shadow:var(--shadow); border:1px solid var(--line);
  margin-bottom:14px;
}
.card-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* Dashboard stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{
  background:var(--card);border-radius:var(--radius);padding:14px;
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.stat .label{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .value{font-size:26px;font-weight:700;color:var(--brand);line-height:1.25;margin-top:2px}
.stat.alt .value{color:#c47b00}
.stat.alt2 .value{color:#1f6fb2}
.stat.alt3 .value{color:#8a4bbd}

/* Form */
.field{margin-bottom:14px}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;color:#2b3d38}
.field label .req{color:var(--danger)}
input,select,textarea{
  width:100%; padding:12px 14px; font-size:15px; font-family:inherit;
  border:1.5px solid var(--line); border-radius:12px; background:#fbfdfc;
  color:var(--text); outline:none; transition:.18s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--brand); background:#fff; box-shadow:0 0 0 3px rgba(13,122,95,.12);
}
select{
  appearance:none;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230d7a5f'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
  background-repeat:no-repeat; background-position:right 10px center;
  background-size:26px; padding-right:42px;
}
textarea{resize:vertical;min-height:64px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:100%; padding:13px 18px; font-size:15.5px; font-weight:700;
  font-family:inherit; border:none; border-radius:12px; cursor:pointer;
  background:var(--brand); color:#fff; transition:.15s;
}
.btn:active{transform:scale(.985);background:var(--brand-dark)}
.btn.secondary{background:var(--brand-light);color:var(--brand-dark);border:1.5px solid #c6e3d8}
.btn.ghost{background:#fff;color:var(--brand-dark);border:1.5px solid var(--line)}
.btn.small{width:auto;padding:9px 14px;font-size:13.5px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Records */
.record{
  background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);
  border-radius:12px;padding:12px 14px;margin-bottom:10px;
  box-shadow:0 1px 4px rgba(13,122,95,.05); position:relative;
}
.record .r-top{display:flex;align-items:flex-start;gap:8px; padding-right:36px;}
.record .r-name{font-weight:700;font-size:15.5px;flex:1}
.record .r-seed{
  background:var(--brand-light);color:var(--brand-dark);
  font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;
}
.record .r-line{font-size:13.5px;color:var(--muted);margin-top:4px;display:flex;gap:6px}
.record .r-line b{color:#3d514b;font-weight:600}
.record .r-date{font-size:12.5px;color:var(--brand);font-weight:700;margin-top:6px;}
.record .del{
  position:absolute;top:10px;right:10px;background:#fdecec;color:var(--danger);border:none;
  width:30px;height:30px;border-radius:9px;font-size:15px;cursor:pointer;display:grid;place-items:center;
}

/* Seeds */
.seed-item{
  display:flex;align-items:center;gap:10px;background:#fbfdfc;border:1px solid var(--line);
  border-radius:11px;padding:11px 14px;margin-bottom:9px;
}
.seed-item .sname{flex:1;font-weight:600;font-size:15px}

/* Empty State */
.empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:14px;}
.empty .big{font-size:40px;display:block;margin-bottom:8px;opacity:.45}

/* Bottom Nav */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -3px 16px rgba(13,122,95,.08);max-width:640px;margin:0 auto;
}
.nav-btn{
  background:none;border:none;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 2px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:10px;transition:.15s;
}
.nav-btn .ni{font-size:19px;line-height:1}
.nav-btn.active{color:var(--brand);background:var(--brand-light)}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);
  background:#12211d;color:#fff;padding:11px 22px;border-radius:999px;
  font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.28s;z-index:200;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Install Card */
.install-card{background:linear-gradient(135deg,#e6f4ef,#f4fbf8);border:1.5px dashed #a9d8c8;}
.install-card p{font-size:13.5px;color:#41564f;margin-bottom:12px}
.search-wrap{margin-bottom:12px}
.count-note{font-size:13px;color:var(--muted);margin-bottom:10px;font-weight:600}
</style>
</head>
<body>

<!-- হেডার ও লোগো -->
<header class="app-header">
  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="28" height="28">
      <g fill="#ffffff">
        <path d="M25 70 Q25 45 40 33 Q60 22 80 33 Q95 45 95 70 Q95 95 80 103 Q60 110 40 103 Q25 95 25 70 Z"/>
        <ellipse cx="18" cy="62" rx="12" ry="8"/>
        <ellipse cx="102" cy="62" rx="12" ry="8"/>
        <path d="M30 35 Q16 18 30 8" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
        <path d="M90 35 Q104 18 90 8" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
        <path d="M60 30 Q58 12 46 4 Q58 10 60 30 Z"/>
        <path d="M60 30 Q62 12 74 4 Q62 10 60 30 Z"/>
        <path d="M60 30 L60 22" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      </g>
    </svg>
  </div>
  <div>
    <h1>ডাঃ মিনহাজ প্রজনন অ্যাপ</h1>
    <p>প্রজনন ব্যবস্থাপনা ড্যাশবোর্ড</p>
  </div>
  <button id="installBtnTop" class="install-btn" hidden>⬇ ইনস্টল</button>
</header>

<main>
  <!-- ড্যাশবোর্ড -->
  <section id="tab-dash" class="tab active">
    <div class="stats">
      <div class="stat">
        <div class="label">মোট এন্ট্রি</div>
        <div class="value" id="statTotal">০</div>
      </div>
      <div class="stat alt">
        <div class="label">আজকের এন্ট্রি</div>
        <div class="value" id="statToday">০</div>
      </div>
      <div class="stat alt2">
        <div class="label">মোট গ্রাহক</div>
        <div class="value" id="statCustomers">০</div>
      </div>
      <div class="stat alt3">
        <div class="label">ব্যবহৃত বীজ</div>
        <div class="value" id="statSeeds">০</div>
      </div>
    </div>

    <div class="card install-card" id="installCard">
      <div class="card-title"><span class="ico">📲</span> অ্যাপ ইনস্টল করুন</div>
      <p id="installMsg">মোবাইলের হোম স্ক্রিনে ইনস্টল করে অফলাইনেও ব্যবহার করুন।</p>
      <button class="btn" id="installBtnCard">⬇ ইনস্টল অ্যাপ</button>
    </div>

    <div class="card">
      <div class="card-title"><span class="ico">🕒</span> সর্বশেষ এন্ট্রি</div>
      <div id="recentList"></div>
    </div>

    <div class="card">
      <div class="card-title"><span class="ico">⚙️</span> ডেটা ব্যাকআপ</div>
      <div class="btn-row">
        <button class="btn ghost small" id="exportCsv" style="width:100%">📄 CSV এক্সপোর্ট</button>
        <button class="btn ghost small" id="exportJson" style="width:100%">💾 ব্যাকআপ (JSON)</button>
      </div>
    </div>
  </section>

  <!-- নতুন ডাটা এন্ট্রি -->
  <section id="tab-add" class="tab">
    <div class="card">
      <div class="card-title"><span class="ico">📝</span> নতুন প্রজনন এন্ট্রি</div>
      <form id="entryForm" autocomplete="off">
        <div class="field">
          <label for="seedSelect">বীজের নাম <span class="req">*</span></label>
          <select id="seedSelect" required>
            <option value="">— বীজ নির্বাচন করুন —</option>
          </select>
        </div>
        <div class="field">
          <label for="customerName">গ্রাহকের নাম <span class="req">*</span></label>
          <input type="text" id="customerName" placeholder="গ্রাহকের পূর্ণ নাম" required>
        </div>
        <div class="field">
          <label for="customerPhone">মোবাইল নম্বর</label>
          <input type="tel" id="customerPhone" placeholder="০১XXXXXXXXX" inputmode="numeric">
        </div>
        <div class="field">
          <label for="customerAddress">ঠিকানা <span class="req">*</span></label>
          <textarea id="customerAddress" placeholder="গ্রাম/বাজার, ইউনিয়ন, উপজেলা, জেলা" required></textarea>
        </div>
        <div class="field">
          <label for="entryDate">তারিখ <span class="req">*</span></label>
          <input type="date" id="entryDate" required>
        </div>
        <div class="field">
          <label for="entryNote">মন্তব্য</label>
          <input type="text" id="entryNote" placeholder="ঐচ্ছিক (যেমন: ২য় ডোজ, ফলোআপ ইত্যাদি)">
        </div>
        <button type="submit" class="btn">✔ সংরক্ষণ করুন</button>
      </form>
    </div>
  </section>

  <!-- রেকর্ড লিস্ট -->
  <section id="tab-list" class="tab">
    <div class="card">
      <div class="card-title"><span class="ico">📋</span> সব রেকর্ড</div>
      <div class="search-wrap">
        <input type="search" id="searchInput" placeholder="🔍 নাম / বীজ / ঠিকানা দিয়ে খুঁজুন">
      </div>
      <div class="count-note" id="countNote"></div>
      <div id="recordsList"></div>
    </div>
  </section>

  <!-- বীজ ম্যানেজমেন্ট -->
  <section id="tab-seeds" class="tab">
    <div class="card">
      <div class="card-title"><span class="ico">🌱</span> বীজের তালিকা</div>
      <form id="seedForm" style="display:flex;gap:8px;margin-bottom:14px">
        <input type="text" id="newSeedName" placeholder="নতুন বীজের নাম" required style="flex:1">
        <button type="submit" class="btn small" style="width:auto">যোগ করুন</button>
      </form>
      <div id="seedList"></div>
    </div>
  </section>
</main>

<!-- নিচের মেনু -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="dash"><span class="ni">🏠</span>ড্যাশবোর্ড</button>
  <button class="nav-btn" data-tab="add"><span class="ni">➕</span>নতুন</button>
  <button class="nav-btn" data-tab="list"><span class="ni">📋</span>রেকর্ড</button>
  <button class="nav-btn" data-tab="seeds"><span class="ni">🌱</span>বীজ</button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   সবকিছু এক ফাইলে - লজিক ও PWA
   ========================================================= */

// ১. ডাইনামিক ম্যানিফেস্ট তৈরি (ইনস্টল বাটনের জন্য)
const manifestData = {
  name: "ডাঃ মিনহাজ প্রজনন অ্যাপ",
  short_name: "প্রজনন অ্যাপ",
  start_url: ".",
  display: "standalone",
  background_color: "#f2f6f5",
  theme_color: "#0d7a5f",
  icons: [{
    src: "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#0d7a5f" rx="100"/><path d="M150 290 Q150 200 200 170 Q256 140 312 170 Q362 200 362 290 Q362 370 312 400 Q256 425 200 400 Q150 370 150 290 Z" fill="#ffffff"/><circle cx="210" cy="290" r="16" fill="#0d7a5f"/><circle cx="302" cy="290" r="16" fill="#0d7a5f"/></svg>`))),
    sizes: "512x512",
    type: "image/svg+xml",
    purpose: "any maskable"
  }]
};
const manifestURL = URL.createObjectURL(new Blob([JSON.stringify(manifestData)], {type: 'application/json'}));
document.querySelector('link[rel="manifest"]')?.remove();
const link = document.createElement('link');
link.rel = 'manifest';
link.href = manifestURL;
document.head.appendChild(link);

// ২. সার্ভিস ওয়ার্কার রেজিস্ট্রেশন
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', (e) => { self.skipWaiting(); });
    self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
    self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });
  `;
  const swURL = URL.createObjectURL(new Blob([swCode], {type: 'application/javascript'}));
  navigator.serviceWorker.register(swURL).catch(() => console.log('SW registration failed'));
}

// ৩. অ্যাপের মূল লজিক
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const LS_SEEDS = 'mh_seeds_v1';
const LS_RECS  = 'mh_records_v1';

const DEFAULT_SEEDS = [
  { id: 'sd1', name: 'ফ্রিজিয়ান' },
  { id: 'sd2', name: 'শাহীওয়াল' },
  { id: 'sd3', name: 'সিন্ধি' },
  { id: 'sd4', name: 'ব্রাহম্যান' },
  { id: 'sd5', name: 'হলস্টেইন ফ্রিজিয়ান' },
  { id: 'sd6', name: 'অ্যাংগাস' }
];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const BN_DIGITS = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
const bnNum = n => String(n).replace(/\d/g, d => BN_DIGITS[+d]);
const BN_MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];

function todayStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function fmtDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  if (!y || !m || !d) return iso;
  return `${bnNum(+d)} ${BN_MONTHS[+m - 1]} ${bnNum(y)}`;
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2200);
}

let seeds = loadSeeds();
let records = loadRecords();

function loadSeeds() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_SEEDS));
    if (Array.isArray(s) && s.length) return s;
  } catch (e) {}
  return DEFAULT_SEEDS.slice();
}
function loadRecords() {
  try {
    const r = JSON.parse(localStorage.getItem(LS_RECS));
    if (Array.isArray(r)) return r;
  } catch (e) {}
  return [];
}
const saveSeeds = () => localStorage.setItem(LS_SEEDS, JSON.stringify(seeds));
const saveRecords = () => localStorage.setItem(LS_RECS, JSON.stringify(records));

function switchTab(name) {
  $$('.tab').forEach(t => t.classList.toggle('active', t.id === 'tab-' + name));
  $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (name === 'dash') renderDashboard();
  if (name === 'list') renderRecords();
  if (name === 'seeds') renderSeeds();
  if (name === 'add') fillSeedSelect();
}
$$('.nav-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

function renderDashboard() {
  const today = todayStr();
  const total = records.length;
  const todayCount = records.filter(r => r.date === today).length;
  const customers = new Set(records.map(r => (r.customer || '').trim())).size;
  const seedTypes = new Set(records.map(r => r.seedName)).size;

  $('#statTotal').textContent = bnNum(total);
  $('#statToday').textContent = bnNum(todayCount);
  $('#statCustomers').textContent = bnNum(customers);
  $('#statSeeds').textContent = bnNum(seedTypes);

  const recent = records.slice().sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt)).slice(0, 5);
  const box = $('#recentList');
  if (!recent.length) {
    box.innerHTML = `<div class="empty"><span class="big">📭</span>এখনো কোনো এন্ট্রি নেই।<br>নিচের <b>“নতুন”</b> বাটন থেকে প্রথম এন্ট্রি করুন।</div>`;
    return;
  }
  box.innerHTML = recent.map(r => recordHTML(r, false)).join('');
}

function recordHTML(r, showDelete = true) {
  const phone = r.phone ? `<div class="r-line"><b>📞</b> ${esc(r.phone)}</div>` : '';
  const note  = r.note  ? `<div class="r-line"><b>📝</b> ${esc(r.note)}</div>`  : '';
  const del   = showDelete ? `<button class="del" data-del="${r.id}" title="মুছুন">🗑</button>` : '';
  return `
    <div class="record">
      ${del}
      <div class="r-top">
        <div class="r-name">${esc(r.customer)}</div>
        <div class="r-seed">${esc(r.seedName)}</div>
      </div>
      <div class="r-line"><b>📍</b> ${esc(r.address)}</div>
      ${phone}${note}
      <div class="r-date">📅 ${fmtDate(r.date)}</div>
    </div>`;
}
function esc(str) {
  return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fillSeedSelect() {
  const sel = $('#seedSelect');
  const cur = sel.value;
  sel.innerHTML = '<option value="">— বীজ নির্বাচন করুন —</option>' + seeds.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  if (cur && seeds.some(s => s.id === cur)) sel.value = cur;
}

$('#entryForm').addEventListener('submit', e => {
  e.preventDefault();
  const seedId = $('#seedSelect').value;
  const seedObj = seeds.find(s => s.id === seedId);
  const customer = $('#customerName').value.trim();
  const phone = $('#customerPhone').value.trim();
  const address = $('#customerAddress').value.trim();
  const date = $('#entryDate').value;
  const note = $('#entryNote').value.trim();

  if (!seedObj) { toast('⚠️ বীজ নির্বাচন করুন'); return; }
  if (!customer) { toast('⚠️ গ্রাহকের নাম লিখুন'); return; }
  if (!address) { toast('⚠️ ঠিকানা লিখুন'); return; }
  if (!date) { toast('⚠️ তারিখ দিন'); return; }

  records.push({ id: uid(), seedId: seedObj.id, seedName: seedObj.name, customer, phone, address, date, note, createdAt: new Date().toISOString() });
  saveRecords();

  e.target.reset();
  $('#entryDate').value = todayStr();
  fillSeedSelect();
  toast('✅ এন্ট্রি সংরক্ষণ হয়েছে');
  switchTab('list');
});

function renderRecords() {
  const q = ($('#searchInput').value || '').trim().toLowerCase();
  let list = records.slice().sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));
  if (q) {
    list = list.filter(r => [r.customer, r.address, r.seedName, r.phone || '', r.note || ''].join(' ').toLowerCase().includes(q));
  }
  $('#countNote').textContent = `মোট ${bnNum(list.length)} টি রেকর্ড`;
  const box = $('#recordsList');
  if (!list.length) {
    box.innerHTML = `<div class="empty"><span class="big">🔍</span>কোনো রেকর্ড পাওয়া যায়নি।</div>`;
    return;
  }
  box.innerHTML = list.map(r => recordHTML(r, true)).join('');
}

$('#searchInput').addEventListener('input', renderRecords);

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-del]');
  if (!btn) return;
  if (confirm('এই এন্ট্রিটি মুছে ফেলবেন?')) {
    records = records.filter(r => r.id !== btn.dataset.del);
    saveRecords();
    renderRecords();
    renderDashboard();
    toast('🗑 এন্ট্রি মুছে ফেলা হয়েছে');
  }
});

function renderSeeds() {
  const box = $('#seedList');
  if (!seeds.length) {
    box.innerHTML = `<div class="empty">কোনো বীজ নেই।</div>`;
    return;
  }
  box.innerHTML = seeds.map(s => `
    <div class="seed-item">
      <span style="color:var(--brand)">🌱</span>
      <span class="sname">${esc(s.name)}</span>
      <button class="del" style="position:static;width:28px;height:28px" data-del-seed="${s.id}">🗑</button>
    </div>`).join('');
}

$('#seedForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('#newSeedName').value.trim();
  if (!name) return;
  if (seeds.some(s => s.name.toLowerCase() === name.toLowerCase())) { toast('⚠️ বীজ আগেই আছে'); return; }
  seeds.push({ id: uid(), name });
  saveSeeds();
  $('#newSeedName').value = '';
  renderSeeds();
  fillSeedSelect();
  toast('✅ বীজ যোগ হয়েছে');
});

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-del-seed]');
  if (!btn) return;
  if (confirm('বীজটি মুছবেন?')) {
    seeds = seeds.filter(x => x.id !== btn.dataset.delSeed);
    saveSeeds();
    renderSeeds();
    fillSeedSelect();
    toast('🗑 বীজ মুছে ফেলা হয়েছে');
  }
});

function download(content, filename, type) {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

$('#exportCsv').addEventListener('click', () => {
  if (!records.length) { toast('⚠️ কোনো ডেটা নেই'); return; }
  const rows = [['তারিখ', 'বীজ', 'নাম', 'মোবাইল', 'ঠিকানা', 'মন্তব্য']];
  records.forEach(r => rows.push([r.date, r.seedName, r.customer, r.phone || '', r.address, r.note || '']));
  const csv = '\uFEFF' + rows.map(row => row.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
  download(csv, `minhaz-data-${todayStr()}.csv`, 'text/csv;charset=utf-8');
  toast('📄 CSV ডাউনলোড হচ্ছে');
});

$('#exportJson').addEventListener('click', () => {
  const data = { app: 'Dr. Minhaz Projonon', exportedAt: new Date().toISOString(), seeds, records };
  download(JSON.stringify(data, null, 2), `minhaz-backup-${todayStr()}.json`, 'application/json');
  toast('💾 ব্যাকআপ ডাউনলোড হচ্ছে');
});

// PWA ইনস্টল
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  $('#installBtnTop').hidden = false;
});
async function doInstall() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') { toast('🎉 ইনস্টল হয়েছে'); $('#installBtnTop').hidden = true; }
    deferredPrompt = null;
  } else {
    alert('📲 ইনস্টল করার নিয়ম:\n\n১. ব্রাউজারের উপরে ডানদিকের ⋮ মেনুতে ক্লিক করুন।\n২. "Install App" বা "Add to Home Screen" সিলেক্ট করুন।');
  }
}
$('#installBtnTop').addEventListener('click', doInstall);
$('#installBtnCard').addEventListener('click', doInstall);

// INIT
(function init() {
  $('#entryDate').value = todayStr();
  fillSeedSelect();
  renderDashboard();
  renderSeeds();
  renderRecords();
  if (window.matchMedia('(display-mode: standalone)').matches) {
    $('#installCard').hidden = true;
    $('#installBtnTop').hidden = true;
  }
})();
</script>
</body>
</html>
