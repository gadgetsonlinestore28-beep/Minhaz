<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E8F8A">
<meta name="description" content="ডাঃ মিনহাজ প্রজনন ব্যবস্থাপনা অ্যাপ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ডাঃ মিনহাজ">
<title>ডাঃ মিনহাজ প্রজনন অ্যাপ</title>
<style>
:root{
  --brand:#0E8F8A;
  --brand-dark:#0E5F7A;
  --brand-light:#e4f5f4;
  --bg:#f1f6f7;
  --card:#ffffff;
  --text:#12211d;
  --muted:#667f82;
  --line:#dbe8ea;
  --danger:#d64545;
  --radius:16px;
  --shadow:0 2px 10px rgba(14,95,122,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans Bengali","Hind Siliguri","SolaimanLipi",system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.65;
  padding-bottom:92px; min-height:100vh;
}
h1,h2,h3,p{margin:0}

.app-header{
  position:sticky; top:0; z-index:50;
  background:linear-gradient(135deg,var(--brand),var(--brand-dark));
  color:#fff; padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top));
  display:flex; align-items:center; gap:12px;
  box-shadow:0 3px 14px rgba(0,0,0,.12);
}
.logo{width:46px;height:46px;border-radius:12px;flex:0 0 46px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.logo img{width:100%;height:100%;display:block}
.app-header h1{font-size:16px;font-weight:700;line-height:1.3}
.app-header p{font-size:12px;opacity:.85}
.install-btn{
  margin-left:auto; background:rgba(255,255,255,.2); color:#fff;
  border:1px solid rgba(255,255,255,.5); border-radius:999px;
  padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer;
  font-family:inherit; white-space:nowrap;
}
.install-btn:active{background:rgba(255,255,255,.35)}
[hidden]{display:none !important}

main{max-width:640px;margin:0 auto;padding:16px}
.tab{display:none}
.tab.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px}
.card-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.stat .label{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .value{font-size:26px;font-weight:700;color:var(--brand);line-height:1.25;margin-top:2px}
.stat.alt .value{color:#c47b00}
.stat.alt2 .value{color:#1f6fb2}
.stat.alt3 .value{color:#d6338a}

.field{margin-bottom:14px}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;color:#2b3d38}
.field label .req{color:var(--danger)}
input,select,textarea{
  width:100%; padding:12px 14px; font-size:15px; font-family:inherit;
  border:1.5px solid var(--line); border-radius:12px; background:#fbfdfd;
  color:var(--text); outline:none; transition:.18s;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(14,143,138,.14)}
select{
  appearance:none;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230E8F8A'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
  background-repeat:no-repeat; background-position:right 10px center; background-size:26px; padding-right:42px;
}
textarea{resize:vertical;min-height:64px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:100%; padding:13px 18px; font-size:15.5px; font-weight:700;
  font-family:inherit; border:none; border-radius:12px; cursor:pointer;
  background:var(--brand); color:#fff; transition:.15s;
}
.btn:active{transform:scale(.985);background:var(--brand-dark)}
.btn.secondary{background:var(--brand-light);color:var(--brand-dark);border:1.5px solid #bfe3e0}
.btn.ghost{background:#fff;color:var(--brand-dark);border:1.5px solid var(--line)}
.btn.small{width:auto;padding:9px 14px;font-size:13.5px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.record{
  background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);
  border-radius:12px;padding:12px 14px;margin-bottom:10px;
  box-shadow:0 1px 4px rgba(14,95,122,.05); position:relative;
}
.record .r-top{display:flex;align-items:flex-start;gap:8px;padding-right:36px}
.record .r-name{font-weight:700;font-size:15.5px;flex:1}
.record .r-seed{background:var(--brand-light);color:var(--brand-dark);font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.record .r-line{font-size:13.5px;color:var(--muted);margin-top:4px;display:flex;gap:6px}
.record .r-line b{color:#3d514b;font-weight:600}
.record .r-date{font-size:12.5px;color:var(--brand);font-weight:700;margin-top:6px}
.record .del{
  position:absolute;top:10px;right:10px;background:#fdecec;color:var(--danger);border:none;
  width:30px;height:30px;border-radius:9px;font-size:15px;cursor:pointer;display:grid;place-items:center;
}

.seed-item{display:flex;align-items:center;gap:10px;background:#fbfdfd;border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-bottom:9px}
.seed-item .sname{flex:1;font-weight:600;font-size:15px}
.seed-item .del{background:#fdecec;color:var(--danger);border:none;border-radius:9px;cursor:pointer;display:grid;place-items:center}

.empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:14px}
.empty .big{font-size:40px;display:block;margin-bottom:8px;opacity:.45}

.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -3px 16px rgba(14,95,122,.08);max-width:640px;margin:0 auto;
}
.nav-btn{
  background:none;border:none;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 2px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:10px;transition:.15s;
}
.nav-btn .ni{font-size:19px;line-height:1}
.nav-btn.active{color:var(--brand);background:var(--brand-light)}

.toast{
  position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);
  background:#12211d;color:#fff;padding:11px 22px;border-radius:999px;
  font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.28s;z-index:200;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.install-card{background:linear-gradient(135deg,#e4f5f4,#f4fbfb);border:1.5px dashed #9fd3d0}
.install-card .ic-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.install-card .ic-head img{width:52px;height:52px;border-radius:13px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.install-card .ic-head b{font-size:15px}
.install-card p{font-size:13.5px;color:#41565a;margin-bottom:12px}
.search-wrap{margin-bottom:12px}
.count-note{font-size:13px;color:var(--muted);margin-bottom:10px;font-weight:600}

/* ইনস্টল গাইড মোডাল (iPhone / অন্য ব্রাউজার) */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:#fff;width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal-box h3{font-size:17px;margin-bottom:10px}
.modal-box ol{margin:0 0 16px;padding-left:22px;font-size:14.5px;color:#34484b}
.modal-box li{margin-bottom:6px}
</style>
</head>
